<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lá thư thứ 23</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--rose:#ff9ec7;--peach:#ffd3a5;--gold:#ffe08a;--violet:#b9a3ff;--ink:#fff7fb;--muted:#d6c8ee;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.2)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:#07041a;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  body.shake{animation:shake .45s}
  @keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
  #sky{position:fixed;inset:0;z-index:0;width:100%;height:100%}
  #confetti{position:fixed;inset:0;z-index:35;pointer-events:none;width:100%;height:100%}
  #flash{position:fixed;inset:0;z-index:34;pointer-events:none;opacity:0;transition:opacity .35s}
  #vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}

  .scene{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:66px 16px 20px;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .7s ease,transform .7s ease;transform:translateY(14px)}
  .scene.on{opacity:1;pointer-events:auto;transform:none}
  .chap{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;text-shadow:0 0 12px rgba(255,224,138,.6)}
  h1,h2,h3{font-family:'Dancing Script',cursive;font-weight:700;line-height:1.1}
  h1{font-size:clamp(50px,12vw,92px);background:linear-gradient(90deg,#ffe3b8,#ff9ec7,#c9a8ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,158,199,.45))}
  h2{font-size:clamp(34px,8vw,52px);color:var(--peach);margin-bottom:8px;text-shadow:0 0 20px rgba(255,180,200,.5)}
  h3{font-size:36px;color:var(--peach);margin-bottom:8px}
  p.lead{max-width:520px;color:var(--muted);line-height:1.7;font-size:16px;margin:10px auto 0;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .btn{margin-top:20px;border:0;cursor:pointer;font:600 16px 'Be Vietnam Pro';color:#2a1037;background:linear-gradient(90deg,var(--peach),var(--rose));
    padding:14px 28px;border-radius:999px;box-shadow:0 8px 30px rgba(255,158,199,.4);transition:transform .15s,opacity .3s}
  .btn:hover{transform:translateY(-2px)} .btn:active{transform:scale(.97)}
  .btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .hidden{display:none!important}
  input.name{margin-top:20px;width:min(320px,90%);padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(10,5,30,.45);
    color:var(--ink);font:400 18px 'Be Vietnam Pro';text-align:center;outline:none;user-select:text;backdrop-filter:blur(6px)}
  input.name:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(255,158,199,.18)}
  .small{font-size:13px;color:var(--muted);margin-top:12px}

  /* HUD + nút */
  #hud{position:fixed;top:14px;left:12px;z-index:20;display:flex;gap:9px;align-items:center;padding:7px 12px;border-radius:999px;
    background:rgba(10,5,30,.55);border:1px solid var(--line);backdrop-filter:blur(8px);font-size:12px;color:var(--muted);opacity:0;transition:opacity .6s;white-space:nowrap}
  #hud.on{opacity:1}
  #clock{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
  #clock.late{color:#ff7a9a;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.5}}
  .pieces{display:flex;gap:4px}
  .piece{width:15px;height:12px;border-radius:3px;border:1px dashed var(--line);transition:all .5s}
  .piece.got{background:linear-gradient(135deg,var(--peach),var(--rose));border:0;transform:rotate(-8deg) scale(1.1);box-shadow:0 0 8px rgba(255,158,199,.7)}
  #lights span{color:var(--gold);transition:all .3s;text-shadow:0 0 8px rgba(255,224,138,.8)}
  #lights span.off{color:#4a3a6a;text-shadow:none}
  .tbtn{position:fixed;top:14px;z-index:21;height:36px;border-radius:999px;border:1px solid var(--line);background:rgba(10,5,30,.55);color:var(--ink);
    cursor:pointer;font:600 12px 'Be Vietnam Pro';backdrop-filter:blur(8px)}
  #sound{right:12px;width:36px;font-size:15px}
  #autoBtn{right:54px;padding:0 12px}
  #autoBtn.on{color:#2a1037;background:linear-gradient(90deg,var(--peach),var(--rose));border:0}

  /* Thẻ tiêu đề chương */
  #card{position:fixed;inset:0;z-index:40;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .8s;
    background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.15),rgba(0,0,0,.6))}
  #card.on{opacity:1}
  #card .bar{position:fixed;left:0;right:0;height:13vh;background:#000;transition:transform .9s cubic-bezier(.7,0,.2,1)}
  #card .bar.t{top:0;transform:translateY(-100%)} #card .bar.b{bottom:0;transform:translateY(100%)}
  #card.on .bar{transform:none}
  #card .c-sub{font-size:13px;letter-spacing:.45em;text-transform:uppercase;color:var(--gold);opacity:0;transform:translateY(10px);transition:all .8s .3s}
  #card .c-title{font-family:'Dancing Script',cursive;font-size:clamp(52px,13vw,96px);margin:6px 0;background:linear-gradient(90deg,#ffe3b8,#ff9ec7,#c9a8ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,158,199,.6));opacity:0;transform:scale(.9);transition:all 1s .45s;letter-spacing:.02em}
  #card .c-time{font-size:15px;color:#fff;opacity:0;transition:all .8s .8s;font-variant-numeric:tabular-nums}
  #card.on .c-sub,#card.on .c-title,#card.on .c-time{opacity:1;transform:none}

  /* Hội thoại */
  #dlg{justify-content:flex-end;padding-bottom:18px;cursor:pointer}
  #cast{flex:1;width:min(700px,100%);position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:0 2% 8px}
  .char{opacity:0;transition:opacity .7s,transform .8s cubic-bezier(.2,.8,.2,1),filter .5s}
  .char.sao{transform:translate(-80px,20px)} .char.bong{transform:translate(80px,20px)}
  .char.in{opacity:1;transform:none}
  .char.in.dim{filter:brightness(.5) saturate(.55);transform:scale(.86)}
  .bob{position:relative;animation:float 3.2s ease-in-out infinite}
  .bong .bob{animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
  .char.sao svg{width:clamp(110px,30vw,150px);height:auto;display:block;filter:drop-shadow(0 0 20px rgba(255,220,120,.75))}
  .char.bong svg{width:clamp(150px,42vw,210px);height:auto;display:block;filter:drop-shadow(0 0 26px rgba(150,90,255,.65))}
  .char.bong.sad svg{filter:drop-shadow(0 0 26px rgba(255,170,220,.7))}
  .spk{position:absolute;left:50%;top:50%;font-size:13px;color:#fff6c2;text-shadow:0 0 8px #ffe08a;animation:orbit 5s linear infinite;pointer-events:none}
  @keyframes orbit{from{transform:rotate(0) translateX(78px) rotate(0)}to{transform:rotate(360deg) translateX(78px) rotate(-360deg)}}
  #prop{position:absolute;left:50%;top:18%;transform:translateX(-50%)}
  .propi{font-size:72px;animation:float 3s ease-in-out infinite, popIn .6s both;filter:drop-shadow(0 0 24px rgba(255,255,255,.5))}
  @keyframes popIn{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
  .dbox{width:min(660px,100%);text-align:left;padding:16px 20px 18px;border-radius:20px;background:linear-gradient(180deg,rgba(24,12,56,.82),rgba(10,5,30,.88));
    border:1px solid rgba(255,200,230,.28);backdrop-filter:blur(12px);box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04) inset;position:relative;overflow:hidden}
  #dname{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.06em;margin-bottom:6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08)}
  #dtext{font-size:17px;line-height:1.7;min-height:3.4em;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  #dtext.narr{font-style:italic;color:#e8def8}
  #dchoices{display:grid;gap:8px;margin-top:12px}
  #dauto{position:absolute;left:0;bottom:0;height:3px;width:100%}
  #dauto i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--peach),var(--rose));opacity:.8}
  .opt{padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font:400 15px 'Be Vietnam Pro';cursor:pointer;text-align:left;transition:all .2s}
  .opt:hover{border-color:var(--rose);background:rgba(255,158,199,.14)}
  .opt.right{border-color:#8fe3b0;background:rgba(143,227,176,.2)} .opt.wrong{border-color:#ff7a9a;background:rgba(255,122,154,.2)}

  /* Phần SVG nhân vật */
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
  .m-open{opacity:0;transform-box:fill-box;transform-origin:center}
  .talking .m-closed{opacity:0}
  .talking .m-open{opacity:1;animation:talk .16s infinite alternate}
  @keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
  .e-sad,.b-soft{opacity:0;transition:opacity 1s}
  .sad .e-sad,.sad .b-soft{opacity:1} .sad .e-angry{opacity:0}
  .tear{animation:tear 2s infinite}
  @keyframes tear{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(16px);opacity:0}}

  /* Màn chơi */
  #g{padding-top:60px;justify-content:flex-start}
  .ghead{width:min(600px,100%);display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:6px 0 8px}
  .ghead .l{text-align:left}
  #gtitle{font-family:'Dancing Script',cursive;font-size:30px;color:var(--peach);line-height:1;text-shadow:0 0 14px rgba(255,180,200,.5)}
  #ggoal{font-size:13px;color:var(--muted);margin-top:4px}
  .ghead .r{text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
  #gtime{font-weight:700;color:var(--gold);font-size:18px} #gtime.low{color:#ff7a9a}
  .gstage{position:relative;width:min(600px,100%);flex:1;max-height:560px;min-height:300px;border-radius:22px;border:1px solid rgba(255,220,240,.25);
    background:rgba(10,5,30,.18);overflow:hidden;touch-action:none;box-shadow:0 0 40px rgba(0,0,0,.35) inset}
  #gover{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:rgba(8,4,24,.72);backdrop-filter:blur(6px);text-align:center}
  #gover p{max-width:420px;color:var(--muted);line-height:1.65;font-size:15px}
  #gover .btns{display:flex;flex-direction:column;gap:2px;align-items:center}
  #gover .auto{margin-top:12px;font-size:13px;color:var(--gold)}
  .gtoast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:calc(100% - 24px);padding:10px 14px;border-radius:14px;background:rgba(10,5,30,.78);
    border:1px solid var(--line);font-size:14px;line-height:1.5;z-index:6;opacity:0;transition:opacity .3s;pointer-events:none}
  .gtoast.on{opacity:1}
  .fly,.moth{position:absolute;width:52px;height:52px;margin:-26px;border-radius:50%;cursor:pointer;z-index:2}
  .fly{background:radial-gradient(circle,#fffde0 0 5px,rgba(255,240,120,.95) 7px,rgba(220,255,120,.35) 15px,transparent 25px);animation:glow 1.3s ease-in-out infinite alternate}
  .moth{background:radial-gradient(circle,#120822 0 8px,rgba(170,90,255,.85) 10px,rgba(130,60,220,.3) 17px,transparent 25px);animation:flutter .16s infinite alternate}
  .caught{animation:caught .6s forwards!important;pointer-events:none}
  @keyframes glow{from{opacity:.6;transform:scale(.85)}to{opacity:1;transform:scale(1.15)}}
  @keyframes flutter{from{transform:scaleX(.6)}to{transform:scaleX(1.1)}}
  @keyframes caught{to{transform:scale(3);opacity:0}}
  .bub{position:absolute;bottom:-70px;max-width:62%;padding:9px 13px;border-radius:999px;cursor:pointer;font-size:13.5px;line-height:1.3;
    background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),rgba(255,255,255,.08) 60%);border:1px solid rgba(220,235,255,.55);color:#eef4ff;transform:translateX(-50%);animation:rise linear forwards;box-shadow:0 0 14px rgba(160,200,255,.25)}
  .bub.gold{background:radial-gradient(circle at 30% 25%,rgba(255,240,180,.55),rgba(255,200,90,.22) 60%);border-color:rgba(255,224,138,.95);color:#fff6cf;box-shadow:0 0 22px rgba(255,224,138,.5)}
  .bub.pop{animation:pop .45s forwards!important;pointer-events:none}
  @keyframes rise{to{bottom:105%}}
  @keyframes pop{to{transform:translateX(-50%) scale(1.6);opacity:0}}
  .spark{position:absolute;font-size:18px;pointer-events:none;animation:spark 1.1s forwards;transform:translate(-50%,-50%);z-index:5}
  @keyframes spark{to{transform:translate(-50%,-170%);opacity:0}}
  .sbtn{position:absolute;width:94px;height:94px;margin:-47px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;display:grid;place-items:center;font-size:38px;
    transition:transform .12s,box-shadow .12s,filter .12s;filter:saturate(.45) brightness(.65)}
  .sbtn.lit{filter:none;transform:scale(1.18)}
  .s0{background:radial-gradient(circle,#ffb3d1,#c2457b)}.s0.lit{box-shadow:0 0 50px 14px #ff9ec7}
  .s1{background:radial-gradient(circle,#ffe8a6,#c99a2a)}.s1.lit{box-shadow:0 0 50px 14px #ffe08a}
  .s2{background:radial-gradient(circle,#b5ecff,#3c8fb8)}.s2.lit{box-shadow:0 0 50px 14px #9ee6ff}
  .s3{background:radial-gradient(circle,#d6c8ff,#6a4fc2)}.s3.lit{box-shadow:0 0 50px 14px #b9a3ff}
  #slabel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;color:#fff;width:120px;text-align:center;text-shadow:0 0 10px #000}
  .rq{position:absolute;inset:0;padding:22px 18px;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .rq .q{font-size:19px;line-height:1.55;max-width:460px;margin-bottom:16px;text-shadow:0 1px 8px #000}
  .rq .opts{display:grid;gap:9px;width:min(440px,100%)}
  .rq .opt{background:rgba(10,5,30,.55)}
  .tbar{position:absolute;left:0;top:0;height:5px;background:linear-gradient(90deg,var(--peach),var(--rose))}
  .why{margin-top:12px;min-height:2.6em;color:var(--peach);font-size:14.5px;max-width:440px;line-height:1.55;text-shadow:0 1px 6px #000}
  .boss{position:absolute;left:50%;top:6px;margin-left:-70px;width:140px;transition:filter .2s;z-index:2}
  .boss svg{width:140px;height:auto;filter:drop-shadow(0 0 22px rgba(150,90,255,.75))}
  .boss .bob{animation:float 2.6s ease-in-out infinite}
  .boss.hit{filter:brightness(2.4) saturate(0)}
  .boss.die{animation:die 1.4s forwards}
  @keyframes die{to{transform:scale(.2) rotate(30deg);opacity:0}}
  .core{position:absolute;left:50%;bottom:18px;margin-left:-28px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#fff 0 7px,#ffd3a5 11px,#ff9ec7 21px,transparent 28px);animation:glow 1.2s infinite alternate}
  .orb{position:absolute;left:0;top:0;width:52px;height:52px;margin:-26px;border-radius:50%;cursor:pointer;z-index:3;
    background:radial-gradient(circle,#05010a 0 10px,rgba(130,50,200,.9) 14px,rgba(110,40,190,.3) 21px,transparent 26px);animation:orbspin 1s linear infinite}
  @keyframes orbspin{50%{filter:brightness(1.5)}}
  .orb.burst{animation:caught .4s forwards;pointer-events:none}
  .chg{position:absolute;left:14px;bottom:20px;display:flex;gap:4px}
  .chg i{width:12px;height:24px;border-radius:4px;background:rgba(255,255,255,.12);transition:all .2s}
  .chg i.on{background:linear-gradient(180deg,var(--gold),var(--rose));box-shadow:0 0 10px rgba(255,224,138,.7)}
  .blast{position:absolute;right:12px;bottom:14px;margin:0;padding:12px 16px;font-size:14px;z-index:4}
  .blast.ready{animation:ready .7s infinite alternate}
  @keyframes ready{to{box-shadow:0 0 30px 8px rgba(255,224,138,.85);transform:scale(1.06)}}
  .beam{position:absolute;left:50%;width:30px;margin-left:-15px;top:90px;bottom:50px;z-index:2;border-radius:20px;background:linear-gradient(0deg,rgba(255,158,199,.1),#fff,rgba(255,224,138,.9));filter:blur(2px);animation:beam .6s forwards}
  @keyframes beam{0%{opacity:0;transform:scaleX(.2)}20%{opacity:1;transform:scaleX(1.5)}100%{opacity:0;transform:scaleX(.3)}}
  .taunt{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:86%;font-size:15px;font-style:italic;color:#e3d4ff;text-shadow:0 0 12px rgba(130,80,230,.9);opacity:0;transition:opacity .4s;pointer-events:none;z-index:5}
  .taunt.on{opacity:1}
  .hpbar{display:inline-block;width:120px;height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;vertical-align:middle}
  .hpbar i{display:block;height:100%;background:linear-gradient(90deg,#8a4fd8,#c86bd8);transition:width .4s}

  /* Bánh */
  .cakewrap{position:relative;width:min(340px,90vw);margin-top:34px}
  .candles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;padding:0 18px;position:relative;z-index:2;margin-bottom:-4px}
  .candle{position:relative;width:8px;height:34px;border-radius:3px;cursor:pointer;background:repeating-linear-gradient(180deg,#fff 0 5px,var(--rose) 5px 10px)}
  .candle.special{background:repeating-linear-gradient(180deg,#e6dbff 0 5px,#8a5bd8 5px 10px)}
  .candle::before{content:"";position:absolute;left:50%;top:-16px;width:10px;height:15px;margin-left:-5px;border-radius:50%/60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%,#fff 0 2px,#ffd54f 4px,#ff8a3d 8px,transparent 9px);animation:flick .25s infinite alternate;transition:opacity .3s;filter:drop-shadow(0 0 6px #ffb347)}
  .candle.special::before{background:radial-gradient(circle at 50% 70%,#fff 0 2px,#d9c2ff 4px,#9a6bff 8px,transparent 9px);filter:drop-shadow(0 0 6px #b98cff)}
  .candle.out::before{opacity:0}
  .candle.out::after{content:"";position:absolute;left:50%;top:-18px;width:3px;height:14px;margin-left:-1px;background:rgba(220,220,240,.5);border-radius:2px;filter:blur(2px);animation:smoke 1.4s forwards}
  @keyframes flick{to{transform:scaleY(1.15) translateY(-1px) rotate(3deg)}}
  @keyframes smoke{to{transform:translateY(-24px) scaleX(3);opacity:0}}
  .tier{margin:0 auto;border-radius:14px 14px 10px 10px;position:relative}
  .t1{width:78%;height:70px;background:linear-gradient(180deg,#ffd6e7,#f7a8c8)}
  .t2{width:100%;height:84px;background:linear-gradient(180deg,#ffe8cc,#f6c08f);margin-top:-2px}
  .t1::before,.t2::before{content:"";position:absolute;left:0;right:0;top:0;height:20px;border-radius:14px 14px 0 0;background:radial-gradient(circle at 10px 6px,#fff 0 10px,transparent 11px) 0 0/22px 20px repeat-x;opacity:.95}
  .plate{width:115%;margin-left:-7.5%;height:14px;border-radius:50%;background:rgba(255,255,255,.25);margin-top:-4px}
  .cake-label{position:absolute;left:0;right:0;top:32px;font-family:'Dancing Script',cursive;font-size:30px;color:#8a2c56}
  .holdbar{width:min(300px,80vw);height:8px;border-radius:9px;background:rgba(255,255,255,.12);margin:18px auto 0;overflow:hidden}
  .holdbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--peach),var(--rose));transition:width .1s}

  /* Thư */
  .letter{position:relative;width:min(560px,100%);max-height:58vh;overflow:auto;margin-top:4px;padding:28px 24px;border-radius:18px;background:#fffaf3;color:#4a2b3a;text-align:left;
    box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 60px rgba(255,180,210,.25);user-select:text;background-image:repeating-linear-gradient(180deg,transparent 0 31px,rgba(200,150,170,.18) 31px 32px);animation:popIn .8s both}
  .letter p{font-size:16px;line-height:32px}
  .letter .hi{font-family:'Dancing Script',cursive;font-size:30px;color:#c44b80;margin-bottom:8px;line-height:1.2}
  .letter .sign{font-family:'Dancing Script',cursive;font-size:26px;color:#c44b80;text-align:right;margin-top:10px}
  .letter .ps{font-style:italic;color:#7a4a62;margin-top:6px}

<script>
(() => {
  const $ = s => document.querySelector(s);

  const rnd=n=>Math.floor(Math.random()*n), rr=(a,b)=>a+Math.random()*(b-a), pick=a=>a[rnd(a.length)];
  let NAME='', FLAGS={}, CK=0, PIECES=[0,0,0,0,0], soundOn=true, AUTO=true;

  /* ================= NHÂN VẬT (SVG) ================= */
  function starPath(R,r){ let d=''; for(let i=0;i<10;i++){ const rad=i%2?r:R, a=-Math.PI/2+i*Math.PI/5; d+=(i?'L':'M')+(Math.cos(a)*rad).toFixed(1)+' '+(Math.sin(a)*rad).toFixed(1); } return d+'Z'; }
  const SAO_SVG=`<svg viewBox="-66 -66 132 132"><defs>

    <ellipse cx="-23" cy="9" rx="6.5" ry="3.6" fill="#ff86b3" opacity=".75"/><ellipse cx="23" cy="9" rx="6.5" ry="3.6" fill="#ff86b3" opacity=".75"/>
    <path class="m-closed" d="M-6 9 Q0 15.5 6 9" stroke="#3b1f3f" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <ellipse class="m-open" cx="0" cy="12" rx="5" ry="4.6" fill="#8a2f55"/></svg>

  const BODY='M-58 6 C-62 -60 62 -60 58 6 C56 38 44 56 32 72 C24 56 16 74 6 62 C-4 76 -14 58 -22 72 C-34 58 -54 40 -58 6Z';

    <filter id="smoke" x="-40%" y="-40%" width="180%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n">

    <g class="e-sad" filter="url(#eg)"><g class="eyes"><circle cx="-18" cy="-6" r="7.5" fill="#3a2156"/><circle cx="18" cy="-6" r="7.5" fill="#3a2156"/><circle cx="-15.5" cy="-8.5" r="2.6" fill="#fff"/><circle cx="20.5" cy="-8.5" r="2.6" fill="#fff"/></g>
      <path class="tear" d="M-21 5 q-3.5 6 0 8.5 q3.5 -2.5 0 -8.5Z" fill="#9ee6ff"/></g>
    <path class="m-closed" d="M-16 20 L-8 15 L0 20 L8 15 L16 20" stroke="#c4a3ff" stroke-width="2.6" fill="none" stroke-linejoin="round" opacity=".85"/>
    <ellipse class="m-open" cx="0" cy="19" rx="11" ry="6.5" fill="#0a0414" stroke="#c4a3ff" stroke-width="1.6"/></svg>`;
  $('#cSao .bob').innerHTML=SAO_SVG; $('#cBong .bob').innerHTML=BONG_SVG; $('#introStar').innerHTML=SAO_SVG.replace(/saoG/g,'saoG2');
  const cSao=$('#cSao'), cBong=$('#cBong');

  /* ================= THẾ GIỚI ĐỘNG (canvas) ================= */
  const cv=$('#sky'), ctx=cv.getContext('2d'), conf=$('#confetti'), cctx=conf.getContext('2d');
  let W=0,H=0,DPR=1,A=1,cur='night',prev=null,fadeAt=0,lastT=performance.now();
  let STARS=[], P={}, wishStars=[];
  const ga=x=>ctx.globalAlpha=Math.max(0,A*x);
  function resize(){
    DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight;
    cv.width=conf.width=W*DPR; cv.height=conf.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); cctx.setTransform(DPR,0,0,DPR,0,0); initWorld();
  }
  function initWorld(){
    STARS=Array.from({length:Math.round(W*H/2400)},()=>({x:rr(0,W),y:rr(0,H),r:rr(.3,1.6),p:rr(0,6.28),s:rr(.6,2.2)}));
    P.clouds=Array.from({length:6},()=>({x:rr(0,W),y:rr(H*.05,H*.5),s:rr(.6,1.5),v:rr(5,14)}));
    P.lights=Array.from({length:Math.round(W/22)},()=>({x:rr(0,W),dy:rr(8,40),p:rr(0,6.28)}));
    P.trees=[0,1,2].map(L=>{ const arr=[]; let x=-30; while(x<W+30){ arr.push({x,h:rr(90,170)*(1+L*.35),w:rr(36,60)*(1+L*.3)}); x+=rr(28,55)*(1+L*.5); } return arr; });
    P.flies=Array.from({length:50},()=>({x:rr(0,W),y:rr(H*.3,H),a:rr(0,6.28),v:rr(8,26),p:rr(0,6.28)}));
    P.mist=Array.from({length:5},()=>({x:rr(0,W),y:rr(H*.55,H*.9),w:rr(W*.5,W*1.1),v:rr(6,16)}));
    P.grass=Array.from({length:Math.round(W/5)},(_,i)=>({x:i*5+rr(-2,2),h:rr(14,40),p:rr(0,6.28)}));
    P.bubbles=Array.from({length:28},()=>({x:rr(0,W),y:rr(H*.5,H),r:rr(2,7),v:rr(14,40)}));
    P.shards=Array.from({length:18},()=>({x:rr(0,W),y:rr(0,H),w:rr(24,70),h:rr(50,120),rot:rr(0,6.28),vr:rr(-.4,.4),vy:rr(-10,-3),p:rr(0,6.28)}));
    P.dust=Array.from({length:70},()=>({x:rr(0,W),y:rr(0,H),v:rr(4,14),p:rr(0,6.28),r:rr(.6,1.8)}));
    P.fall=[];
    P.vortex=Array.from({length:260},()=>({a:rr(0,6.28),r:rr(10,Math.max(W,H)*.7),s:rr(.8,2)}));
    P.embers=Array.from({length:70},()=>({x:rr(0,W),y:rr(0,H),v:rr(10,40),p:rr(0,6.28),r:rr(.8,2.4)}));
    const bc=['#ff9ec7','#ffd3a5','#b9a3ff','#9ee6ff','#ffe08a','#ff8fa3','#a8f0c6'];
    P.balloons=Array.from({length:13},()=>({x:rr(0,W),y:rr(0,H*1.4),v:rr(18,40),c:pick(bc),p:rr(0,6.28),s:rr(.7,1.25)}));
    P.fw=[]; P.fwT=.5; P.bolt=null; P.shoot=null;
  }
  function bgGrad(stops){ const g=ctx.createLinearGradient(0,0,0,H); stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c)); ga(1); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
  function bgRad(x,y,stops){ const g=ctx.createRadialGradient(x,y,0,x,y,Math.max(W,H)*.9); stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c)); ga(1); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
  function drawStars(t,k,maxY){ ctx.fillStyle='#fff'; for(const s of STARS){ if(s.y>maxY) continue; ga(k*(.25+.75*(.5+.5*Math.sin(s.p+t*s.s)))); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill(); } }
  const clear=c=>c[0]==='#'?c+'00':c.replace(/,[^,]*\)$/,',0)');
  function glow(x,y,r,col,a){ const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,col); g.addColorStop(1,clear(col)); ga(a); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill(); }
  function moon(x,y,r){ glow(x,y,r*5,'rgba(255,236,190,.35)',1); const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r); g.addColorStop(0,'#fffdf0'); g.addColorStop(1,'#f0dcae');
    ga(1); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill(); ctx.fillStyle='#d9c08e'; [[.3,-.2,.18],[-.35,.25,.13],[.1,.4,.1]].forEach(([a,b,c])=>{ ga(.45); ctx.beginPath(); ctx.arc(x+a*r,y+b*r,c*r,0,6.283); ctx.fill(); }); }
  function cloud(x,y,s,col,a){ ga(a); ctx.fillStyle=col; ctx.beginPath(); [[-34,0,24],[-10,-14,32],[22,-6,28],[42,6,20],[0,8,30]].forEach(([dx,dy,r])=>{ ctx.moveTo(x+dx*s+r*s,y+dy*s); ctx.arc(x+dx*s,y+dy*s,r*s,0,6.283); }); ctx.fill(); }
  function shooting(t,dt){ if(!P.shoot&&Math.random()<.006) P.shoot={x:rr(0,W*.7),y:rr(0,H*.35),l:0}; const s=P.shoot; if(!s) return; s.l+=dt*700; const a=1-s.l/520; if(a<=0){P.shoot=null;return;}
    const g=ctx.createLinearGradient(s.x+s.l,s.y+s.l*.45,s.x+s.l-110,s.y+(s.l-110)*.45); g.addColorStop(0,'#fff'); g.addColorStop(1,'rgba(255,255,255,0)');
    ga(a); ctx.strokeStyle=g; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(s.x+s.l,s.y+s.l*.45); ctx.lineTo(s.x+s.l-110,s.y+(s.l-110)*.45); ctx.stroke(); }
  const hillF=x=>H*.76+Math.sin(x*.006)*20+Math.sin(x*.017)*9, hillN=x=>H*.86+Math.sin(x*.004+1)*24+Math.sin(x*.013)*10;
  function hill(f,col){ ga(1); ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,H); for(let x=0;x<=W+10;x+=10) ctx.lineTo(x,f(x)); ctx.lineTo(W,H); ctx.fill(); }

  const SC={
    night(t,dt){
      bgGrad(['#0e0828','#24125a','#4a2580','#8a4590']); drawStars(t,1,H*.85); shooting(t,dt);
      moon(W*.8,H*.16,Math.min(W,H)*.065);
      for(const c of P.clouds){ c.x+=c.v*dt; if(c.x>W+150) c.x=-150; cloud(c.x,c.y,c.s,'#d8c8ff',.09); }

      for(const l of P.lights){ const y=hillN(l.x)+l.dy; glow(l.x,y,7,'rgba(255,210,120,.9)',.5+.5*Math.sin(t*2+l.p)); }
    },
    forest(t,dt){
      bgGrad(['#04111a','#0a2c2e','#11493f','#082620']); drawStars(t,.55,H*.5); moon(W*.2,H*.12,Math.min(W,H)*.045);
      const cols=['#0f3d36','#0a2c27','#04170f'], base=[H*.7,H*.82,H*1.0];
      P.trees.forEach((arr,L)=>{ ga(1); ctx.fillStyle=cols[L];
        for(const tr of arr){ const sw=Math.sin(t*.7+tr.x*.01)*(L+1)*1.6; const by=base[L];
          ctx.beginPath(); for(let k=0;k<3;k++){ const ty=by-tr.h*(.38+k*.31), bw=tr.w*(1-k*.25), bot=by-tr.h*(k*.28);
            ctx.moveTo(tr.x-bw/2,bot); ctx.lineTo(tr.x+sw*(k+1)/3,ty); ctx.lineTo(tr.x+bw/2,bot); } ctx.fill(); ctx.fillRect(tr.x-3,by-tr.h*.1,6,tr.h*.12); }
        if(L===0) for(const m of P.mist){ m.x+=m.v*dt; if(m.x-m.w>W) m.x=-m.w*.5; const g=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.w*.5); g.addColorStop(0,'rgba(170,240,215,.13)'); g.addColorStop(1,'rgba(0,0,0,0)'); ga(1); ctx.fillStyle=g; ctx.fillRect(m.x-m.w*.5,m.y-m.w*.5,m.w,m.w); }
      });
      for(const f of P.flies){ f.a+=rr(-1.5,1.5)*dt; f.x+=Math.cos(f.a)*f.v*dt; f.y+=Math.sin(f.a)*f.v*dt*.6; if(f.x<0)f.x=W; if(f.x>W)f.x=0; if(f.y<H*.25)f.y=H; if(f.y>H)f.y=H*.25;
        const b=.5+.5*Math.sin(t*3+f.p); glow(f.x,f.y,10,'rgba(230,255,140,.95)',b); }
      ga(1); ctx.strokeStyle='#03140d'; ctx.lineWidth=2; ctx.beginPath(); for(const g of P.grass){ const sw=Math.sin(t*1.4+g.p)*5; ctx.moveTo(g.x,H); ctx.quadraticCurveTo(g.x+sw*.5,H-g.h*.5,g.x+sw,H-g.h); } ctx.stroke();
    },
    sea(t,dt){
      const hz=H*.5; bgGrad(['#060c2a','#132a66','#2e5199']); drawStars(t,.9,hz); moon(W*.5,H*.18,Math.min(W,H)*.06);
      const g=ctx.createLinearGradient(0,hz,0,H); g.addColorStop(0,'#1c3f86'); g.addColorStop(.5,'#0c2058'); g.addColorStop(1,'#030a24'); ga(1); ctx.fillStyle=g; ctx.fillRect(0,hz,W,H-hz);
      for(let i=0;i<18;i++){ const y=hz+4+i*((H-hz)/19), w=(14+i*7)*(.55+.45*Math.sin(t*2.2+i*1.3)); ga(.5*(1-i/19)); ctx.fillStyle='#fff3c4'; ctx.fillRect(W*.5-w/2+Math.sin(t+i)*4,y,w,2.2); }
      for(let L=0;L<6;L++){ const y0=hz+(L+.6)*(H-hz)/6.5, amp=3+L*3.2; ga(1); ctx.fillStyle=`rgba(${24+L*8},${55+L*14},${130+L*14},.3)`; ctx.beginPath(); ctx.moveTo(0,H);
        for(let x=0;x<=W+12;x+=12) ctx.lineTo(x,y0+Math.sin(x*.018/(1+L*.25)+t*(.6+L*.22))*amp+Math.sin(x*.05+t*1.4)*amp*.3); ctx.lineTo(W,H); ctx.fill();
        ga(.25); ctx.strokeStyle='#bcd6ff'; ctx.lineWidth=1; ctx.beginPath(); for(let x=0;x<=W+12;x+=12){ const y=y0+Math.sin(x*.018/(1+L*.25)+t*(.6+L*.22))*amp+Math.sin(x*.05+t*1.4)*amp*.3; x?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke(); }
      ctx.strokeStyle='rgba(210,235,255,.7)'; ctx.lineWidth=1.2; for(const b of P.bubbles){ b.y-=b.v*dt; b.x+=Math.sin(t*2+b.r)*.3; if(b.y<hz){ b.y=H+10; b.x=rr(0,W); } ga(.5); ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283); ctx.stroke(); }
    },
    mirror(t,dt){
      bgRad(W/2,H*.4,['#7271ac','#2e2858','#0b0920']); drawStars(t,.35,H);
      for(let i=0;i<5;i++){ ctx.save(); ctx.translate(W/2,-30); ctx.rotate(Math.sin(t*.25+i*1.7)*.5+(i-2)*.32); const g=ctx.createLinearGradient(0,0,0,H*1.2);
        g.addColorStop(0,'rgba(255,255,255,.16)'); g.addColorStop(1,'rgba(255,255,255,0)'); ga(1); ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.lineTo(70,H*1.2); ctx.lineTo(-70,H*1.2); ctx.fill(); ctx.restore(); }
      for(const s of P.shards){ s.rot+=s.vr*dt; s.y+=s.vy*dt; if(s.y<-140){ s.y=H+140; s.x=rr(0,W); }

    const h=document.createElement('h3'); h.textContent=title; o.appendChild(h);
    const p=document.createElement('p'); p.textContent=text; o.appendChild(p);
    const w=document.createElement('div'); w.className='btns';
    btns.forEach(([l,f,ghost])=>{ const b=document.createElement('button'); b.className='btn'+(ghost?' ghost':''); b.textContent=l; b.onclick=()=>{ clearInterval(o._iv); f(); }; w.appendChild(b); });
    o.appendChild(w);
    if(auto){ let s=auto.sec; const a=document.createElement('div'); a.className='auto'; o.appendChild(a); const upd=()=>a.textContent=auto.label+' '+s+'s…'; upd();
      o._iv=setInterval(()=>{ s--; if(s<=0){ clearInterval(o._iv); btns[0][1](); } else upd(); },1000); }
  }
  function hideOver(){ const o=$('#gover'); clearInterval(o._iv); o.classList.add('hidden'); }
  function sparkAt(st,el,ch){ const r=st.getBoundingClientRect(), b=el.getBoundingClientRect(); const s=document.createElement('div'); s.className='spark'; s.textContent=ch||'⭐';
    s.style.left=(b.left-r.left+b.width/2)+'px'; s.style.top=(b.top-r.top+b.height/2)+'px'; st.appendChild(s); setTimeout(()=>s.remove(),1100); }

    ], ()=>game({
      bg:'mirror', title:'Mê Cung Gương', goal:'Lặp lại thứ tự sáng của 4 ngôi sao',
      howto:'Xem các ngôi sao sáng lên theo thứ tự, rồi chạm lại đúng thứ tự đó. Có 4 lượt (3 → 6 ngôi). Sai một lần là mất 1 ✦ và phải xem lại dãy.',
      winText:'Những tấm gương vỡ tan thành bụi sáng. Mảnh thư thứ ba rơi xuống tay cậu.',
      start(st,api){
        const pos=[[50,20],[80,50],[50,80],[20,50]], icons=['💗','⭐','💧','🔮'], freqs=[523,659,784,988], lens=[3,4,5,6];
        const btns=pos.map(([x,y],i)=>{ const b=document.createElement('div'); b.className='sbtn s'+i; b.style.left=x+'%'; b.style.top=y+'%'; b.textContent=icons[i]; st.appendChild(b); return b; });
        const lab=document.createElement('div'); lab.id='slabel'; st.appendChild(lab);
        let round=0,seq=[],input=[],accepting=false; api.prog('Lượt 1 / 4'); api.time('');
        const flash=(i,d)=>{ btns[i].classList.add('lit'); tone(freqs[i],0,d/1000+.2,'sine',.1); setTimeout(()=>btns[i].classList.remove('lit'),d); };
        function newRound(){ seq=Array.from({length:lens[round]},()=>rnd(4)); play(); }
        function play(){ accepting=false; input=[]; lab.textContent='Nhìn kỹ…'; let k=0; const sp=Math.max(420,700-round*80);
          api.after(function step(){ if(k<seq.length){ flash(seq[k++],sp*.65); api.after(step,sp); } else { accepting=true; lab.textContent='Đến lượt cậu!'; } },800); }
        btns.forEach((b,i)=>b.addEventListener('pointerdown',e=>{ e.preventDefault(); if(!accepting||!api.alive()) return; flash(i,220); input.push(i);
          if(input[input.length-1]!==seq[input.length-1]){ accepting=false; api.hurt(); if(api.alive()){ lab.textContent='Sai rồi! Xem lại nhé…'; api.after(play,1000); } return; }
          if(input.length===seq.length){ accepting=false; round++; if(round>=lens.length){ lab.textContent='Hoàn hảo!'; api.after(()=>api.win(),600); } else { lab.textContent='Chuẩn luôn!'; chime(1100); api.prog('Lượt '+(round+1)+' / 4'); api.after(newRound,1000); } } }));
        newRound();
      },
      onWin(){ gotPiece(3); talk('mirror',[
        {who:'sao', t:'Mảnh thứ ba: “Cậu không cần chắc chắn về mọi thứ. Cậu chỉ cần tiếp tục bước.”', mood:'📜'},
        {who:'bong', t:'…Được lắm. Nhưng cây cầu tiếp theo là của ta.', fx:'shake'}
      ], ()=>runCh(4)); }
    })));

      {t:'Đỉnh Trời. Gió ngừng thổi. Mọi vì sao đều nín thở.'},
      {who:'bong', t:'Đến tận đây cơ à. Bốn mảnh giấy vụn mà cũng đòi thắng ta?', fx:'shake'},
      {who:'bong', t:'Năm nào cũng vậy thôi. Người ta chúc vài câu rồi quên. Sinh nhật nào rồi cũng thuộc về ta.'},
      {who:'sao', t:'Sai rồi! Có người đã ngồi viết lá thư này cho {N} đấy. Có người NHỚ!'},
      {who:'sao', t:'{N}, phá những quả cầu bóng tối để tích ánh sáng. Đầy 5 vạch thì PHÓNG KÝ ỨC thẳng vào nó!'},
      {who:'bong', t:'Thử xem.', fx:'flash'}
    ], ()=>game({
      bg:'void', title:'Đỉnh Trời', goal:'Đánh bại Bóng Đêm trước nửa đêm',
      howto:'Chạm vào các quả cầu bóng tối đang rơi xuống để phá chúng. Mỗi quả phá được tích 1 vạch ánh sáng. Đầy 5 vạch thì bấm “Phóng ký ức” để tấn công. Để cầu chạm đến trái tim ở dưới là mất 1 ✦. Bóng Đêm sẽ mạnh dần lên.',
      winText:'Tia sáng cuối cùng xuyên thủng màn đêm…',
      start(st,api){
        let hp=100,charge=0,phase=1,orbs=[]; api.time('');
        const boss=document.createElement('div'); boss.className='boss'; boss.innerHTML='<div class="bob">'+BONG_SVG+'</div>'; st.appendChild(boss);
        const core=document.createElement('div'); core.className='core'; st.appendChild(core);
        const chg=document.createElement('div'); chg.className='chg'; chg.innerHTML='<i></i><i></i><i></i><i></i><i></i>'; st.appendChild(chg);
        const bl=document.createElement('button'); bl.className='btn blast'; bl.textContent='Phóng ký ức ✦'; bl.disabled=true; st.appendChild(bl);
        const ta=document.createElement('div'); ta.className='taunt'; st.appendChild(ta);
        const hpDraw=()=>api.prog('Bóng Đêm <span class="hpbar"><i style="width:'+hp+'%"></i></span>'); hpDraw();
        const chgDraw=()=>{ chg.querySelectorAll('i').forEach((x,k)=>x.classList.toggle('on',k<charge)); bl.disabled=charge<5; bl.classList.toggle('ready',charge>=5); };
        const taunt=t=>{ ta.textContent=t; ta.classList.add('on'); boss.classList.add('talking'); clearTimeout(ta._t); setTimeout(()=>boss.classList.remove('talking'),1300); ta._t=setTimeout(()=>ta.classList.remove('on'),2400); };
        taunt('“Ngươi nghĩ sẽ có ai nhớ sinh nhật ngươi sao?”');
        const SPD=[0,85,120,155], GAP=[0,1150,880,680];
        function spawn(){ const w=st.clientWidth; const o={x0:30+Math.random()*(w-60),y:110,t:Math.random()*6,el:document.createElement('div')}; o.x=o.x0; o.el.className='orb'; st.appendChild(o.el); orbs.push(o);
          o.el.addEventListener('pointerdown',e=>{ e.preventDefault(); if(!api.alive()||o.dead) return; o.dead=1; o.el.classList.add('burst'); sparkAt(st,o.el,'✦'); setTimeout(()=>o.el.remove(),400); popS(); if(charge<5){ charge++; chgDraw(); } }); }
        (function sched(){ spawn(); if(phase>=3&&Math.random()<.35) api.after(spawn,250); api.after(sched,GAP[phase]); })();
        api.loop(dt=>{ const h=st.clientHeight, sc=h/420;
          for(const o of orbs){ if(o.dead) continue; o.y+=SPD[phase]*sc*dt; o.t+=dt*2.2; if(phase>=2) o.x=o.x0+Math.sin(o.t)*(phase>=3?42:22); o.el.style.transform=`translate(${o.x}px,${o.y}px)`;
            if(o.y>h-45){ o.dead=1; o.el.classList.add('burst'); setTimeout(()=>o.el.remove(),400); api.hurt(); } }
          orbs=orbs.filter(o=>!o.dead); });
        const lines=['“Á! …Chỉ là may mắn thôi!”','“Sinh nhật nào rồi cũng bị quên! Kể cả của ngươi!”','“Không… sao ánh sáng này lại ấm đến thế…”'];
        const saoLines=['Sao Nhỏ: “Trúng rồi! Tiếp đi!”','Sao Nhỏ: “Nó đang yếu đi! Cố lên {N}!”','Sao Nhỏ: “Một đòn nữa thôi!”'];
        bl.addEventListener('click',()=>{ if(charge<5||!api.alive()) return; charge=0; chgDraw();
          const b=document.createElement('div'); b.className='beam'; st.appendChild(b); setTimeout(()=>b.remove(),600); fx('flash'); [784,988,1175,1568].forEach((f,k)=>tone(f,k*.05,.5,'sine',.08));
          boss.classList.add('hit'); setTimeout(()=>boss.classList.remove('hit'),250); hp-=25; hpDraw();
          orbs.forEach(o=>{ o.dead=1; o.el.classList.add('burst'); setTimeout(()=>o.el.remove(),400); }); orbs=[];
          if(hp<=0){ boss.classList.add('die','sad'); doom(); api.after(()=>api.win(),1400); return; }
          phase=hp>50?2:3; const k=3-Math.round(hp/25); if(k===2) boss.classList.add('sad');
          taunt(lines[k]); api.after(()=>api.toast(fill(saoLines[k])),1200); document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); });
      },
      onWin(){ gotPiece(5); runCh(6); }
    })));
  }

  function finale(){
    setClock('23:58',true); setBg('void');
    const extra=FLAGS.gave?[{who:'bong',mood:'sad',t:'Cậu… là người đầu tiên từng cho tôi một thứ gì đó.'}]:[];
    talk('void',[
      {t:'Bóng Đêm co lại, nhỏ dần, nhỏ dần, cho đến khi chỉ còn bằng một hòn sỏi.'},
      {who:'bong', mood:'sad', t:'Đừng… tôi chỉ là… tôi chỉ không muốn bị quên thôi mà.'},
      ...extra,
      {t:'Hóa ra Bóng Đêm chỉ là nỗi sợ bị lãng quên. Ai cũng mang theo nó, kể cả vào ngày sinh nhật của mình.'},
      {who:'sao', t:'{N}… quyết định là của cậu.', choice:[
        ['Ôm lấy nó', ()=>{ FLAGS.ending='friend'; return [
          {do:()=>setBg('night')},
          {t:'Cậu dang tay ôm lấy cái bóng nhỏ. Nó run lên, ấm dần, sáng dần…', mood:'🤍'},
          {who:'bong', mood:'sad', t:'Ấm quá… Năm nay, cho tôi làm ngọn nến thứ 23 của cậu nhé?'},
          {t:'✦ KẾT THÚC: NGỌN NẾN THỨ 23 ✦', mood:'🕯️', fx:'flash'} ]; }],
        ['Để nó tan vào bầu trời', ()=>{ FLAGS.ending='sky'; return [
          {do:()=>setBg('night')},
          {t:'Bóng Đêm tan ra thành hàng nghìn đốm sáng, rải kín cả bầu trời. Mỗi đốm là một lời chúc ai đó từng dành cho cậu.', mood:'✨'},
          {who:'bong', mood:'sad', t:'Hóa ra… cậu chưa bao giờ bị quên cả.'},
          {t:'✦ KẾT THÚC: BẦU TRỜI ĐẦY LỜI CHÚC ✦', mood:'🌠', fx:'flash'} ]; }]
      ]},
      {t:'Mảnh thư thứ năm, mảnh có chữ ký, nhẹ nhàng rơi vào tay cậu.', mood:'💌'},
      {who:'sao', t:'Sắp hết ngày rồi! Nhanh lên, thổi nến để ghép lá thư lại nào!'}
    ], ()=>runCh(7));
  }

  let lit=23, holdIv=null;
  function cake(){
    setClock('23:59',true); setBg('cake'); go('#s5'); const c=$('#candles'); c.innerHTML=''; lit=23; $('#blowBtn').disabled=false;
    $('#cakeHint').textContent='Thổi tắt cả 23 ngọn nến để lá thư liền lại. Giữ nút để thổi, hoặc chạm từng ngọn.';
    $('#cakeName').textContent=NAME.length<=10?NAME:'Happy 23';
    for(let i=0;i<23;i++){ const d=document.createElement('div'); d.className='candle'+(i===22&&FLAGS.ending==='friend'?' special':''); d.addEventListener('pointerdown',()=>blowOne(d)); c.appendChild(d); }
    upd();
  }
  function blowOne(d){ if(!d||d.classList.contains('out')||lit<=0) return; d.classList.add('out'); lit--; tone(300+Math.random()*200,0,.2,'sine',.04); upd(); if(lit===0) doneCake(); }
  const upd=()=>$('#holdFill').style.width=((23-lit)/23*100)+'%';
  const bb=$('#blowBtn');
  bb.addEventListener('pointerdown',e=>{ e.preventDefault(); if(holdIv||lit===0) return; audio(); holdIv=setInterval(()=>{ const r=[...document.querySelectorAll('.candle:not(.out)')]; if(!r.length) return stopHold(); blowOne(pick(r)); },110); });
  function stopHold(){ clearInterval(holdIv); holdIv=null; }
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>bb.addEventListener(ev,stopHold));
  bb.addEventListener('contextmenu',e=>e.preventDefault());
  function doneCake(){ stopHold(); bb.disabled=true; setClock('00:00 ✓'); $('#cakeHint').textContent='Tắt hết rồi! Năm mảnh thư đang tự ghép lại…'; happyBirthday(); confetti(220); setTimeout(()=>{ CK=7; save(); go('#s6'); writeLetter(); },3400); }

  function writeLetter(){
    const L=$('#letter'); L.innerHTML=''; L.style.maxHeight='';
    const add=(cls,txt)=>{ const p=document.createElement('p'); if(cls) p.className=cls; p.textContent=txt; L.appendChild(p); p.style.animation='fadeUp .9s both'; L.scrollTop=L.scrollHeight; return p; };
    const body=[['hi','Gửi '+NAME+','],['','Chúc mừng sinh nhật cậu, tròn 23 tuổi rồi đấy!'],
      ['','Cậu đã đi xa hơn cậu nghĩ nhiều lắm. Tuổi 23 là một cái độ tuổi mà đủ lớn để tự lo cho mình, nhưng vẫn đủ trẻ để được phép lạc đường vài lần mà chẳng ai trách. Nên nếu năm nay có lúc thấy mông lung, cứ nhớ rằng ai cũng từng như vậy.'],
      ['','Mấy chuyện lo âu cứ để mai tính, hôm nay cậu chỉ việc vui. Tớ chúc cậu tuổi mới mọi sự nhẹ nhàng, nhiều bữa ăn ngon, nhiều ngày được là chính mình.'],
      ['','Cậu không cần chắc chắn về mọi thứ đâu. Cậu chỉ cần tiếp tục bước, rạng rỡ, dịu dàng và bướng bỉnh theo cách rất riêng của cậu.'],
      ['','Lúc dựng game này, tớ nhận ra chúng ta đều đã lớn hơn nhiều, vì một năm nào đó, tớ mới chỉ dựng được bản trắng đen thô sơ gửi sang cậu… giờ thứ tớ làm được đã màu mè vậy rồi nè =))'],
      ['','Chúc mừng ngày cậu có mặt trên thế gian này.'],['sign','— '+SIGN+' ♡']];
    let i=0; (function next(){ if(i<body.length){ add(...body[i++]); setTimeout(next,1400); } })();
    $('#wishrow').classList.remove('hidden'); $('#endbox').classList.add('hidden'); $('#wishIn').value='';
  }
  function sendWish(){
    const r=$('#wishBtn').getBoundingClientRect(); const s=document.createElement('div'); s.className='flystar'; s.textContent='⭐'; s.style.left=(r.left+r.width/2-14)+'px'; s.style.top=(r.top-10)+'px'; document.body.appendChild(s);
    const tx=rr(.2,.8)*W, ty=rr(.05,.2)*H; requestAnimationFrame(()=>{ s.style.transform=`translate(${tx-r.left}px,${ty-r.top}px) scale(.4)`; s.style.opacity='0'; });
    for(let k=0;k<5;k++) tone(880*Math.pow(1.122,k),k*.12,.7,'sine',.06);
    setTimeout(()=>{ s.remove(); wishStars.push({x:tx,y:ty,p:Math.random()*6}); confetti(160); },2500);
    $('#wishrow').classList.add('hidden'); $('#finalLine').textContent='Sinh nhật vui vẻ nhé, '+NAME+'! 🎂';
    $('#endTag').textContent=FLAGS.ending==='friend'?'Kết thúc: Ngọn nến thứ 23 · còn 1 kết thúc khác':'Kết thúc: Bầu trời đầy lời chúc · còn 1 kết thúc khác';
    $('#endbox').classList.remove('hidden'); $('#letter').style.maxHeight='36vh';
  }
  $('#wishBtn').onclick=sendWish; $('#wishIn').addEventListener('keydown',e=>{ if(e.key==='Enter') sendWish(); });
  $('#replay').onclick=()=>{ clearSave(); FLAGS={}; PIECES=[0,0,0,0,0]; drawPieces(); setupIntro(); go('#s0'); setBg('night'); };

  const CHAPTERS=[prologue,ch1,ch2,ch3,ch4,ch5,finale,cake];

  /* Confetti */
  let parts=[], confOn=false;
  function confetti(n){ const cols=['#ffd3a5','#ff9ec7','#ffe08a','#b8a4ff','#9ee6ff','#ffffff'];
    for(let i=0;i<(n||180);i++) parts.push({x:rr(0,W),y:-rr(0,H*.4),vx:rr(-1.5,1.5),vy:rr(2,5),s:rr(4,10),r:rr(0,6.28),vr:rr(-.1,.1),c:cols[i%6]});
    if(!confOn){ confOn=true; requestAnimationFrame(drawConf); } }
  function drawConf(){ cctx.clearRect(0,0,W,H);
    for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vx+=Math.sin(p.y/60)*.03; cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.r); cctx.fillStyle=p.c; cctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cctx.restore(); }
    parts=parts.filter(p=>p.y<H+40); if(parts.length) requestAnimationFrame(drawConf); else { confOn=false; cctx.clearRect(0,0,W,H); } }

  /* Mở đầu */
  const nameIn=$('#nameIn');
  function setupIntro(){ const s=load(); nameIn.value='Trang'; const cb=$('#contBtn');
    if(s&&s.CK>0&&s.CK<7){ cb.textContent='Chơi tiếp: '+CH_NAMES[s.CK]; cb.classList.remove('hidden'); } else cb.classList.add('hidden');
    $('#startBtn').disabled=!nameIn.value.trim(); }
  nameIn.addEventListener('input',()=>$('#startBtn').disabled=!nameIn.value.trim());
  nameIn.addEventListener('keydown',e=>{ if(e.key==='Enter'&&nameIn.value.trim()) $('#startBtn').click(); });
  $('#startBtn').onclick=()=>{ NAME=nameIn.value.trim(); FLAGS={}; PIECES=[0,0,0,0,0]; drawPieces(); audio(); startMusic(); chime(880); go('#none'); runCh(0); };
  $('#contBtn').onclick=()=>{ const s=load(); if(!s) return; NAME=nameIn.value.trim()||s.NAME; FLAGS=s.FLAGS||{}; PIECES=s.PIECES||[0,0,0,0,0]; drawPieces(); audio(); startMusic(); go('#none'); runCh(s.CK); };

  addEventListener('resize',resize); resize(); requestAnimationFrame(frame); drawLights(); setupIntro();
})();
</script>
</body>
</html>
